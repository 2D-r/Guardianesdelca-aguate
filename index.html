<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardianes del Cañaguate - 2°A</title>
    <!-- Ruta actualizada a tu carpeta css en la raíz -->
    <link href="./css/styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f0fdf4; }
    </style>
</head>
<body class="text-gray-800">

    <nav class="bg-green-600 p-4 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-wider">🌱 ExpoCiencia 2°A</h1>
            <ul class="hidden md:flex space-x-6 font-bold">
                <li><a href="#mapa" class="hover:text-yellow-300 transition">Mapa Digital</a></li>
                <li><a href="#crecimiento" class="hover:text-yellow-300 transition">Bitácora</a></li>
                <li><a href="#datos" class="hover:text-yellow-300 transition">Resultados</a></li>
            </ul>
        </div>
    </nav>

    <header class="container mx-auto text-center py-16 px-4">
        <h2 class="text-4xl md:text-6xl font-black text-green-700 mb-4">
            ¡Salvemos nuestro suelo con <span class="text-yellow-400">Cañaguates</span>!
        </h2>
        <p class="text-xl md:text-2xl text-gray-600 font-bold max-w-3xl mx-auto mb-8">
            Las Bombas de Vida del grado 2°A para restaurar el Colegio La Nueva Esperanza. 
            ¡Conviértete en un Guardián del Cañaguate!
        </p>
    </header>

    <section id="mapa" class="bg-white py-12 px-4 shadow-inner">
        <div class="container mx-auto text-center mb-8">
            <h3 class="text-3xl font-black text-green-600">🗺️ Mapa de Lanzamiento</h3>
            <div class="relative bg-green-100 rounded-3xl border-4 border-green-500 p-8 max-w-4xl mx-auto h-80 flex items-center justify-center mt-6">
                <!-- Se activará con JavaScript -->
                <button id="btn-lanzar" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-black py-2 px-6 rounded-full shadow-lg z-10 relative">
                    Simular Lanzamiento de Bomba
                </button>
                <div id="marcador-zona" class="hidden absolute top-1/4 left-1/4 bg-[#78350f] w-8 h-8 rounded-full animate-bounce shadow-lg border-2 border-white"></div>
            </div>
        </div>
    </section>

    <!-- Ruta a tu script en la carpeta js -->
    <script src="./js/main.js"></script>
</body>
</html>
